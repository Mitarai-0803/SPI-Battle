*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}

label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px;text-align:left}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:700;width:100%;margin-top:12px}
#ch{display:grid;gap:8px;margin-top:12px}
#ch button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
#ch button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 18%,var(--card))}
#bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.me{font-weight:700;color:var(--ac)}.sm{font-size:13px;color:var(--sub)}
.hide{display:none}#ex{margin-top:12px;font-size:14px}
.opt{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:8px;align-items:center}
button:disabled{color:var(--tx)}.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ac);opacity:.2;transition:width .7s}
.ot,.cnt{position:relative}.cnt{font-size:12px;color:var(--sub);white-space:nowrap}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));animation:pop .5s}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 18%,var(--card));animation:shake .4s}
.opt.dim{opacity:.6}.opt.pick{border-color:var(--ac)}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tools button{padding:8px 12px;font-size:14px;text-align:center}.tools button.on{border-color:var(--ac)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--ac);color:#fff;margin-right:6px}
.badge{display:inline-block;padding:4px 10px;border:1px solid var(--bd);border-radius:99px;margin:4px 6px 0 0;font-size:14px}
#q{white-space:pre-line}.rv{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}

};

const TT=[[1700,"レジェンド👑"],[1200,"マスター🔥"],[800,"エース⚡"],[400,"挑戦者🚀"],[0,"見習い🌱"]],title=s=>TT.find(t=>s>=t[0])[1];
